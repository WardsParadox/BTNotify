name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build universal app
    # GitHub's macOS 27 / Xcode 27 hosted image is currently in preview.
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run core tests
        run: swift test --parallel

      - name: Build Release app
        run: |
          xcodebuild \
            -project BTNotify.xcodeproj \
            -scheme BTNotify \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build/ci \
            -quiet \
            "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            build

      - name: Check login and scripting integration
        run: |
          .build/ci/Build/Products/Release/BTNotify.app/Contents/MacOS/BTNotify --check-launch-at-login
          .build/ci/Build/Products/Release/BTNotify.app/Contents/MacOS/BTNotify --check-apple-events

      - name: Verify and package app
        run: |
          codesign --verify --deep --strict .build/ci/Build/Products/Release/BTNotify.app
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            .build/ci/Build/Products/Release/BTNotify.app \
            dist/BTNotify-macOS.zip

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: BTNotify-macOS
          path: dist/BTNotify-macOS.zip
          if-no-files-found: error
          retention-days: 14
